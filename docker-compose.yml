x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monopoly-deal-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_NAME: "${DB_NAME:-db}"
      DB_USER: "${DB_USER:-db}"
      DB_PASS: "${DB_PASS:-db}"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monopoly-network
    logging: *default-logging

  db:
    image: mysql:8.0
    container_name: monopoly-deal-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE: "${DB_NAME:-db}"
      MYSQL_USER: "${DB_USER:-db}"
      MYSQL_PASSWORD: "${DB_PASS:-db}"
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - monopoly-network
    logging: *default-logging

volumes:
  db_data:

networks:
  monopoly-network:
    driver: bridge
